# Inactive recipe. Copy this job into .github/workflows/ci.yml next to the `docs` job.
# Not run from the template repository: check it in a throwaway repo first.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The unit tests of the pure modules need no Qt, so nothing is installed.
      - name: Unit tests
        run: python -m unittest discover -s tests
