# Runs on every push to main and every pull request.
# The docs check is language-neutral. Add the project's own jobs below (see docs/technical/testing.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Docs check tests
        run: node --test "scripts/*.test.mjs"

      - name: Docs links and index
        run: node scripts/check-docs.mjs

  # Add the project's tests here. Test on the platform users really have:
  #
  # test:
  #   runs-on: windows-latest   # or ubuntu-latest / macos-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - ... install, test, build
